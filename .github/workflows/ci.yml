name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            npx commitlint --from HEAD~1 --to HEAD --verbose
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet format server/FitnessCenter.slnx --verify-no-changes --verbosity diagnostic
      - run: npm ci
        working-directory: client
      - run: npx ng lint
        working-directory: client
      - run: npx prettier --check "src/**/*.{ts,html,css}"
        working-directory: client

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet test server/FitnessCenter.slnx -c Release --collect:"XPlat Code Coverage" --results-directory TestResults --logger "trx;LogFileName=server.trx"
      - run: npm ci
        working-directory: client
      - run: npx ng test --watch=false --coverage
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults/**
            client/coverage/**

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet publish server/FitnessCenter.Api/FitnessCenter.Api.csproj -c Release -o artifacts/api
      - run: npm ci
        working-directory: client
      - run: npx ng build --configuration=production
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            artifacts/api/**
            client/dist/**

  image:
    name: image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/FitnessCenter.Api/Dockerfile
          push: false
          tags: fitness-center-api:local
